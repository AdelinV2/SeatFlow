name: Set up GCP Workload Identity Federation
description: Authenticate GitHub Actions to GCP without a service-account key

inputs:
  project_id:
    description: GCP project ID
    required: true
  workload_identity_provider:
    description: Full Workload Identity Provider resource name
    required: true
  service_account:
    description: Deploy service account email
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate with Workload Identity Federation
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ inputs.project_id }}
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
        token_format: access_token
        create_credentials_file: true
        export_environment_variables: true

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ inputs.project_id }}
        version: '>= 540.0.0'

