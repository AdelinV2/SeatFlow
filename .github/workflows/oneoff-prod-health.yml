name: One-off - Inspect Production Health

on:
  push:
    branches: [ops/sync-prometheus-identity-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  inspect-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Inspect non-secret production health
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_VM_ZONE}" \
            --tunnel-through-iap --quiet \
            --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== TOKEN FILE ==='
          if [[ -s /run/seatflow/prometheus-scrape-token ]]; then
            stat -c 'exists=true mode=%a owner=%U group=%G size=%s' /run/seatflow/prometheus-scrape-token
          else
            echo 'exists=false'
          fi
          echo '=== PROMETHEUS REFRESH TIMER ==='
          systemctl is-active seatflow-prometheus-token-refresh.timer || true
          systemctl is-enabled seatflow-prometheus-token-refresh.timer || true
          echo '=== CONTAINERS ==='
          docker ps -a --format '{{.Names}}|{{.Status}}' | sort
          echo '=== HEALTH/RESTARTS ==='
          for id in $(docker ps -aq); do
            docker inspect --format '{{.Name}}|status={{.State.Status}}|health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|restarts={{.RestartCount}}|exit={{.State.ExitCode}}' "${id}"
          done | sort
          REMOTE
