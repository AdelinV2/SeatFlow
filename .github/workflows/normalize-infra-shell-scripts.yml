name: Normalize Infra Shell Scripts

on:
  push:
    branches:
      - feat/p10-007-github-actions-compute-engine-cd-wif

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/p10-007-github-actions-compute-engine-cd-wif
          fetch-depth: 0

      - name: Normalize shell scripts to LF
        shell: python
        run: |
          from pathlib import Path
          for path in Path('infra/scripts').glob('*.sh'):
              data = path.read_bytes()
              normalized = data.replace(b'\r\n', b'\n').replace(b'\r', b'\n')
              if normalized != data:
                  path.write_bytes(normalized)

      - name: Commit normalization when needed
        shell: bash
        run: |
          if git diff --quiet -- infra/scripts; then
            echo "Shell scripts are already LF-normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/scripts/*.sh
          git commit -m "fix(infra): normalize shell scripts for Linux CI"
          git push origin HEAD:feat/p10-007-github-actions-compute-engine-cd-wif
