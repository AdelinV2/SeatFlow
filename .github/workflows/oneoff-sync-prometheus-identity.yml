name: One-off - Sync Prometheus Monitoring Identity

on:
  push:
    branches: [ops/sync-prometheus-identity-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  sync-monitoring-identity:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Synchronize and diagnose monitoring identity without exposing secrets
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_VM_ZONE}" \
            --tunnel-through-iap --quiet \
            --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail
          project_id='seatflow-production-507311'
          metadata_url='http://metadata.google.internal/computeMetadata/v1'
          auth_url='https://txyyirobwnomhxygbacq.supabase.co/auth/v1/token?grant_type=password'
          publishable_key='sb_publishable_PYk5C_1_YArT3EV24KjdDA_60lYr5ff'
          expected_email='prometheus@seat-flow.me'
          sync_url='https://txyyirobwnomhxygbacq.supabase.co/functions/v1/seatflow-sync-prom-76e30479bb3fb764'
          sync_guard='xpMf0Hs-sdS5HOiJln3tDwCUzVAd9cLNSoOVKQZS72Q'
          temp_response=$(mktemp)
          temp_body=$(mktemp)
          trap 'rm -f "${temp_response}" "${temp_body}"' EXIT

          metadata_response=$(curl -fsS -H 'Metadata-Flavor: Google' \
            "${metadata_url}/instance/service-accounts/default/token")
          access_token=$(printf '%s' "${metadata_response}" | jq -er '.access_token')
          unset metadata_response

          fetch_secret() {
            local secret_name=$1 response encoded
            response=$(curl -fsS \
              -H "Authorization: Bearer ${access_token}" \
              "https://secretmanager.googleapis.com/v1/projects/${project_id}/secrets/${secret_name}/versions/latest:access")
            encoded=$(printf '%s' "${response}" | jq -er '.payload.data')
            printf '%s' "${encoded}" | base64 --decode
          }

          password=$(fetch_secret prometheus-identity-password)
          stored_email=$(fetch_secret prometheus-identity-email)
          if [[ -z ${password} || ${password} == *$'\n'* || ${password} == *$'\r'* ]]; then
            echo 'Monitoring password secret is empty or malformed' >&2
            exit 1
          fi
          if [[ ${stored_email} == "${expected_email}" ]]; then
            echo 'EMAIL_SECRET_MATCH=true'
          else
            echo 'EMAIL_SECRET_MATCH=false'
          fi

          jq -n --arg password "${password}" '{password:$password}' > "${temp_body}"
          sync_status=$(curl -sS -o "${temp_response}" -w '%{http_code}' \
            -X POST "${sync_url}" \
            -H "x-seatflow-sync: ${sync_guard}" \
            -H 'Content-Type: application/json' \
            --data-binary "@${temp_body}")
          if [[ ${sync_status} != 200 ]]; then
            echo "SYNC_STATUS=${sync_status}" >&2
            jq -c '{ok,stage}' "${temp_response}" >&2 || true
            exit 1
          fi
          jq -e '.ok == true and .scope == "metrics.read"' "${temp_response}" >/dev/null
          echo 'PASSWORD_SYNC=true'

          jq -n --arg email "${expected_email}" --arg password "${password}" \
            '{email:$email,password:$password}' > "${temp_body}"

          apikey_only_status=$(curl -sS -o "${temp_response}" -w '%{http_code}' \
            -X POST "${auth_url}" \
            -H "apikey: ${publishable_key}" \
            -H 'Content-Type: application/json' \
            --data-binary "@${temp_body}")
          echo "AUTH_APIKEY_ONLY=${apikey_only_status}"

          authorization_status=$(curl -sS -o "${temp_response}" -w '%{http_code}' \
            -X POST "${auth_url}" \
            -H "apikey: ${publishable_key}" \
            -H "Authorization: Bearer ${publishable_key}" \
            -H 'Content-Type: application/json' \
            --data-binary "@${temp_body}")
          echo "AUTH_WITH_AUTHORIZATION=${authorization_status}"

          if [[ ${authorization_status} == 200 ]]; then
            token=$(jq -er '.access_token' "${temp_response}")
            payload=${token#*.}
            payload=${payload%%.*}
            payload=$(printf '%s' "${payload}" | tr '_-' '/+')
            while (( ${#payload} % 4 != 0 )); do payload+='='; done
            scope=$(printf '%s' "${payload}" | base64 --decode 2>/dev/null | jq -er '.scope')
            [[ ${scope} == 'metrics.read' ]]
            echo 'AUTH_SCOPE_VALID=true'
            unset token payload scope
          elif [[ ${apikey_only_status} == 200 ]]; then
            echo 'AUTH_SCOPE_VALID=not-checked-in-second-response'
          else
            echo 'Both direct authentication variants failed' >&2
            exit 1
          fi

          unset password stored_email access_token sync_guard
          REMOTE
