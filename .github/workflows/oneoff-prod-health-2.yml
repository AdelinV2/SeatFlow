name: One-off - Inspect Live Production Health 2

on:
  push:
    branches: [ops/prod-health-20260901-2]

permissions:
  contents: read
  id-token: write

jobs:
  inspect-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Diagnose Java startup without exposing environment
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_VM_ZONE}" \
            --tunnel-through-iap --quiet \
            --command='sudo bash -s' <<'REMOTE'
          set -u
          services=(seatflow-eureka seatflow-user seatflow-seatmap seatflow-event seatflow-reservation seatflow-payment seatflow-ticket seatflow-notification seatflow-realtime seatflow-gateway)
          for name in "${services[@]}"; do
            if ! docker inspect "${name}" >/dev/null 2>&1; then
              echo "=== ${name}: MISSING ==="
              continue
            fi
            echo "=== ${name} STATE ==="
            docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} error={{.State.Error}}' "${name}"
            echo "--- recent health results ---"
            docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}{{println "exit=" .ExitCode " output=" .Output}}{{end}}{{end}}' "${name}" | tail -10
            echo "--- filtered application errors ---"
            docker logs --tail 220 "${name}" 2>&1 \
              | grep -Ei 'ERROR|Exception|Caused by|FATAL|OutOfMemory|Killed|connection refused|authentication failed|permission denied|does not exist|failed to|unable to|Flyway|HikariPool' \
              | sed -E 's#(password|token|secret|api[_-]?key)=([^[:space:]]+)#\1=[REDACTED]#Ig' \
              | tail -45 || true
          done
          REMOTE
