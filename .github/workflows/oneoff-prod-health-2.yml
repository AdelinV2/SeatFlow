name: One-off - Rescue Production Kafka Healthcheck

on:
  push:
    branches: [ops/prod-health-20260901-2]

permissions:
  contents: read
  id-token: write

jobs:
  rescue-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Rescue blocked Kafka healthcheck and resume Compose
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" --project="${GCP_PROJECT_ID}" --zone="${GCP_VM_ZONE}" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/seatflow

          # Release #6 still has the pre-fix base Compose file with Kafka timeout
          # hard-coded to 10s. Apply a temporary runtime-only override so the
          # current deployment can finish. The permanent fix is already on develop.
          override=/run/seatflow/kafka-health-rescue.yml
          cat > "${override}" <<'YAML'
          services:
            kafka:
              healthcheck:
                timeout: 45s
                interval: 10s
                retries: 10
                start_period: 30s
          YAML
          chown root:root "${override}"
          chmod 0600 "${override}"

          runtime=/run/seatflow/runtime.env
          compose=(docker compose -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.monitoring.yml -f docker-compose.prod.yml -f "${override}" --env-file "${runtime}")
          "${compose[@]}" config --quiet

          # Recreate only Kafka. The named Kafka data volume remains attached.
          "${compose[@]}" up -d --no-deps --force-recreate kafka

          for i in $(seq 1 12); do
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' seatflow-kafka)
            echo "KAFKA_HEALTH=${health}"
            if [[ ${health} == healthy ]]; then
              break
            fi
            sleep 10
          done

          health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' seatflow-kafka)
          [[ ${health} == healthy ]] || { echo "Kafka did not become healthy after rescue" >&2; exit 1; }

          echo 'KAFKA_RESCUE=healthy'
          docker inspect --format 'kafka status={{.State.Status}} health={{.State.Health.Status}} restarts={{.RestartCount}}' seatflow-kafka
          REMOTE
