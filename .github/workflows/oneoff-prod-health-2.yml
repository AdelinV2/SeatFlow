name: One-off - Inspect Live Production Health 2

on:
  push:
    branches: [ops/prod-health-20260901-2]

permissions:
  contents: read
  id-token: write

jobs:
  inspect-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Inspect active deployment phase
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" --project="${GCP_PROJECT_ID}" --zone="${GCP_VM_ZONE}" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -u
          echo '=== ACTIVE RELEASE PROCESSES ==='
          ps -eo pid,etime,args | grep -E 'deploy-compose-release|rollback-compose-release|verify-compose-release|docker compose' | grep -v grep || true
          echo '=== RELEASE METADATA (NON-SECRET) ==='
          for f in /opt/seatflow/deployment/current.env /opt/seatflow/deployment/previous.env; do
            if [[ -f ${f} ]]; then
              echo "--- ${f}"
              grep -E '^SEATFLOW_(IMAGE_TAG|RELEASE_VERSION|RELEASE_TIMESTAMP)=' "${f}" || true
            else
              echo "--- ${f} missing"
            fi
          done
          echo '=== CORE DEPENDENCY HEALTH ==='
          for n in seatflow-postgres seatflow-redis seatflow-kafka seatflow-eureka; do
            docker inspect --format '{{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}}' "${n}" || true
          done
          REMOTE
