name: One-off - Rescue Production Kafka Healthcheck

on:
  push:
    branches: [ops/prod-health-20260901-2]

permissions:
  contents: read
  id-token: write

jobs:
  rescue-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Rescue blocked Kafka healthcheck and resume Compose
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" --project="${GCP_PROJECT_ID}" --zone="${GCP_VM_ZONE}" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/seatflow

          runtime=/run/seatflow/runtime.env
          if grep -q '^KAFKA_HEALTHCHECK_TIMEOUT=' "${runtime}"; then
            sed -i 's/^KAFKA_HEALTHCHECK_TIMEOUT=.*/KAFKA_HEALTHCHECK_TIMEOUT=45s/' "${runtime}"
          else
            printf '\nKAFKA_HEALTHCHECK_TIMEOUT=45s\n' >> "${runtime}"
          fi
          chown root:root "${runtime}"
          chmod 0600 "${runtime}"

          compose=(docker compose -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.monitoring.yml -f docker-compose.prod.yml --env-file "${runtime}")
          "${compose[@]}" config --quiet

          # Recreate only Kafka so Docker applies the larger production timeout.
          # Named Kafka data remains attached; no volume or data deletion occurs.
          "${compose[@]}" up -d --no-deps --force-recreate kafka

          for i in $(seq 1 12); do
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' seatflow-kafka)
            echo "KAFKA_HEALTH=${health}"
            if [[ ${health} == healthy ]]; then
              break
            fi
            sleep 10
          done

          health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' seatflow-kafka)
          [[ ${health} == healthy ]] || { echo "Kafka did not become healthy after rescue" >&2; exit 1; }

          # The original deployment may still be blocked inside its Compose call;
          # resume the same desired stack after Kafka is healthy.
          "${compose[@]}" up -d --remove-orphans
          echo 'COMPOSE_RESCUE=success'

          for n in seatflow-postgres seatflow-redis seatflow-kafka seatflow-eureka seatflow-user seatflow-seatmap seatflow-event seatflow-reservation seatflow-payment seatflow-ticket seatflow-notification seatflow-realtime seatflow-gateway seatflow-frontend; do
            docker inspect --format '{{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}}' "${n}" 2>/dev/null || true
          done
          REMOTE
