name: One-off - Repair Production Redis Health

on:
  push:
    branches: [ops/sync-prometheus-identity-20260901]

permissions:
  contents: write
  id-token: write

jobs:
  patch-source-and-vm:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Patch Redis production health contract on develop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docker/docker-compose.prod.yml')
          text = path.read_text()
          old = '''  redis:\n    ports: !reset []\n    expose:\n      - "6379"\n    command: ["redis-server", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?required}"]\n    healthcheck:\n      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \\\"$$REDIS_PASSWORD\\\" ping | grep -q PONG"]\n'''
          new = '''  redis:\n    ports: !reset []\n    expose:\n      - "6379"\n    environment:\n      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}\n    command: ["redis-server", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?required}"]\n    healthcheck:\n      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \\\"$$REDIS_PASSWORD\\\" ping | grep -q PONG"]\n'''
          if old not in text:
              raise SystemExit('Expected Redis production block not found; refusing broad edit')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- docker/docker-compose.prod.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docker/docker-compose.prod.yml
          git commit -m 'fix(infra): provide Redis password to healthcheck' 
          git push origin HEAD:develop

      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Apply same Redis health fix on production VM
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_VM_ZONE}" \
            --tunnel-through-iap --quiet \
            --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/opt/seatflow/docker-compose.prod.yml')
          text = path.read_text()
          old = '''  redis:\n    ports: !reset []\n    expose:\n      - "6379"\n    command: ["redis-server", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?required}"]\n    healthcheck:\n      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \\\"$$REDIS_PASSWORD\\\" ping | grep -q PONG"]\n'''
          new = '''  redis:\n    ports: !reset []\n    expose:\n      - "6379"\n    environment:\n      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}\n    command: ["redis-server", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?required}"]\n    healthcheck:\n      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \\\"$$REDIS_PASSWORD\\\" ping | grep -q PONG"]\n'''
          if old not in text:
              raise SystemExit('Expected Redis production block not found on VM; refusing broad edit')
          path.write_text(text.replace(old, new, 1))
          PY
          cd /opt/seatflow
          compose=(docker compose -f docker-compose.yml -f docker-compose.services.yml -f docker-compose.monitoring.yml -f docker-compose.prod.yml --env-file /run/seatflow/runtime.env)
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d redis
          for _ in $(seq 1 20); do
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' seatflow-redis)
            echo "REDIS_HEALTH=${health}"
            [[ ${health} == healthy ]] && exit 0
            sleep 3
          done
          exit 1
          REMOTE
