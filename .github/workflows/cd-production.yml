name: CD - Production GCE Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  build-images:
    name: Build release ${{ matrix.image }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: eureka-server, context: ./backend, dockerfile: ./backend/services/eureka-server/Dockerfile }
          - { image: api-gateway, context: ./backend, dockerfile: ./backend/services/api-gateway/Dockerfile }
          - { image: user-service, context: ./backend, dockerfile: ./backend/services/user-service/Dockerfile }
          - { image: seat-map-service, context: ./backend, dockerfile: ./backend/services/seat-map-service/Dockerfile }
          - { image: event-service, context: ./backend, dockerfile: ./backend/services/event-service/Dockerfile }
          - { image: reservation-service, context: ./backend, dockerfile: ./backend/services/reservation-service/Dockerfile }
          - { image: payment-service, context: ./backend, dockerfile: ./backend/services/payment-service/Dockerfile }
          - { image: ticket-service, context: ./backend, dockerfile: ./backend/services/ticket-service/Dockerfile }
          - { image: realtime-service, context: ./backend, dockerfile: ./backend/services/realtime-service/Dockerfile }
          - { image: notification-service, context: ./backend, dockerfile: ./backend/services/notification-service/Dockerfile }
          - { image: frontend, context: ./frontend, dockerfile: ./frontend/Dockerfile }
          - { image: otel-collector, context: ./docker, dockerfile: ./docker/otel/Dockerfile.collector }
          - { image: tempo, context: ./docker, dockerfile: ./docker/otel/Dockerfile.tempo }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require semantic release tag when tag-triggered
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable release image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true

  deploy:
    name: Deploy immutable release to production VM
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Write non-secret release manifest
        run: |
          jq -n \
            --arg sha "${GITHUB_SHA}" \
            --arg version "${GITHUB_REF_NAME}" \
            --arg registry "${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}" \
            '{schemaVersion: 1, imageTag: $sha, releaseVersion: $version, registry: $registry}' \
            > deployment-manifest.json

      - name: Package deployment contract
        run: |
          tar -czf "/tmp/seatflow-${GITHUB_SHA}.tar.gz" docker infra/scripts infra/systemd deployment-manifest.json

      - name: Upload release bundle through IAP
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        run: |
          gcloud compute scp "/tmp/seatflow-${GITHUB_SHA}.tar.gz" \
            "${GCP_VM_NAME}:/tmp/seatflow-${GITHUB_SHA}.tar.gz" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_VM_ZONE}" \
            --tunnel-through-iap --quiet

      - name: Deploy release through IAP and OS Login
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
          GATEWAY_HEALTH_URL: ${{ vars.GATEWAY_HEALTH_URL }}
        run: |
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_VM_ZONE}" \
            --tunnel-through-iap --quiet \
            --command="set -euo pipefail; \
              release_dir=/opt/seatflow/releases/${GITHUB_SHA}; \
              sudo install -d -o root -g root -m 0750 \"\${release_dir}\"; \
              sudo tar -xzf /tmp/seatflow-${GITHUB_SHA}.tar.gz -C \"\${release_dir}\"; \
              sudo bash \"\${release_dir}/infra/scripts/deploy-compose-release.sh\" \
                \"\${release_dir}\" '${GITHUB_SHA}' '${GITHUB_REF_NAME}' \
                '${GCP_PROJECT_ID}' '${GCP_REGION}' '${ARTIFACT_REGISTRY_REPOSITORY}' \
                '${GATEWAY_HEALTH_URL}'; \
              rm -f /tmp/seatflow-${GITHUB_SHA}.tar.gz"

      - name: Upload release manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-deployment-${{ github.sha }}
          path: deployment-manifest.json
          retention-days: 90
