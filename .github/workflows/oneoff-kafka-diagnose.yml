name: One-off - Diagnose Production Kafka

# snapshot-trigger: 2026-09-01T20:36Z
on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-kafka:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Inspect production migration metadata without mutations
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" --project="${GCP_PROJECT_ID}" --zone="${GCP_VM_ZONE}" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail

          echo '=== MIGRATION MARKERS ==='
          find /opt/seatflow/deployment -maxdepth 1 -type f -name 'migrations-*.done' -printf '%f\n' 2>/dev/null | sort || true

          echo '=== MIGRATION CONTAINERS ==='
          docker ps -a --filter 'name=seatflow-migrate-' --format '{{.Names}} status={{.Status}} image={{.Image}}' | sort || true

          echo '=== CURRENT RELEASE IMAGE TAG ==='
          if [[ -f /run/seatflow/runtime.env ]]; then
            grep '^SEATFLOW_IMAGE_TAG=' /run/seatflow/runtime.env || true
          fi

          databases=(
            seatflow_user
            seatflow_seatmap
            seatflow_event
            seatflow_reservation
            seatflow_payment
            seatflow_ticket
            seatflow_notification
          )

          echo '=== DATABASE MIGRATION HISTORY ==='
          for db in "${databases[@]}"; do
            echo "--- ${db}"
            docker exec seatflow-postgres bash -lc \
              'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$1" -Atc "SELECT to_regclass('"'"'public.flyway_schema_history'"'"');"' \
              -- "${db}" 2>/dev/null || { echo 'database-unavailable'; continue; }

            has_history=$(docker exec seatflow-postgres bash -lc \
              'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$1" -Atc "SELECT CASE WHEN to_regclass('"'"'public.flyway_schema_history'"'"') IS NULL THEN '"'"'no'"'"' ELSE '"'"'yes'"'"' END;"' \
              -- "${db}" 2>/dev/null || echo no)
            if [[ ${has_history} == yes ]]; then
              docker exec seatflow-postgres bash -lc \
                'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$1" -AtF "|" -c "SELECT installed_rank, version, description, success FROM flyway_schema_history ORDER BY installed_rank;"' \
                -- "${db}" 2>/dev/null || true
            fi

            printf 'outbox_events='
            docker exec seatflow-postgres bash -lc \
              'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$1" -Atc "SELECT CASE WHEN to_regclass('"'"'public.outbox_events'"'"') IS NULL THEN '"'"'missing'"'"' ELSE '"'"'present'"'"' END;"' \
              -- "${db}" 2>/dev/null || echo unknown
            if [[ ${db} == seatflow_event ]]; then
              printf 'event_pricing_tiers='
              docker exec seatflow-postgres bash -lc \
                'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$1" -Atc "SELECT CASE WHEN to_regclass('"'"'public.event_pricing_tiers'"'"') IS NULL THEN '"'"'missing'"'"' ELSE '"'"'present'"'"' END;"' \
                -- "${db}" 2>/dev/null || echo unknown
            fi
          done

          echo '=== ACTIVE MIGRATION LOG SIGNALS ==='
          while read -r name; do
            [[ -n ${name} ]] || continue
            echo "--- ${name}"
            docker logs --tail 100 "${name}" 2>&1 \
              | sed -E 's#(password|passwd|token|secret|api[_-]?key|authorization)[=:][^[:space:]]+#\1=[REDACTED]#Ig' \
              | grep -Ei 'flyway|migration|schema|successfully applied|up to date|error|exception|failed|started .*application' \
              | tail -60 || true
          done < <(docker ps -a --filter 'name=seatflow-migrate-' --format '{{.Names}}')
          REMOTE
