name: One-off - Diagnose Production Kafka

on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-kafka:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Snapshot container dependency chain
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" --project="${GCP_PROJECT_ID}" --zone="${GCP_VM_ZONE}" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -u
          printf '%-30s %-10s %-11s %-8s %-5s\n' NAME STATUS HEALTH RESTARTS OOM
          docker ps -a --format '{{.Names}}' | sort | while read -r n; do
            docker inspect --format '{{.Name}}|{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|{{.RestartCount}}|{{.State.OOMKilled}}' "${n}"
          done | while IFS='|' read -r n s h r o; do
            printf '%-30s %-10s %-11s %-8s %-5s\n' "${n#/}" "$s" "$h" "$r" "$o"
          done
          echo '=== NON-HEALTHY LAST HEALTH RESULT ==='
          docker ps -a --format '{{.Names}}' | sort | while read -r n; do
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$n")
            if [[ $health != healthy && $health != none ]]; then
              echo "--- $n health=$health"
              docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}{{println "exit=" .ExitCode " output=" .Output}}{{end}}{{end}}' "$n" | tail -4
            fi
          done
          REMOTE
