name: One-off - Diagnose Production Kafka

on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-kafka:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Diagnose JVM restarts and health probes without mutations
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" --project="${GCP_PROJECT_ID}" --zone="${GCP_VM_ZONE}" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -u
          redact() {
            sed -E \
              -e 's#(password|passwd|token|secret|api[_-]?key|authorization)[=:][^[:space:]]+#\1=[REDACTED]#Ig' \
              -e 's#Bearer [A-Za-z0-9._~+/=-]+#Bearer [REDACTED]#Ig'
          }

          echo '=== HOST PRESSURE ==='
          uptime
          awk '/MemTotal|MemFree|MemAvailable|SwapTotal|SwapFree/ {print}' /proc/meminfo
          echo '=== CONTAINER STATS ==='
          docker stats --no-stream --format '{{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} pids={{.PIDs}}' | sort
          echo '=== KERNEL OOM SIGNALS ==='
          dmesg -T 2>/dev/null | grep -Ei 'out of memory|oom-kill|killed process' | tail -20 || true

          services=(seatflow-user seatflow-seatmap seatflow-event seatflow-reservation seatflow-payment seatflow-ticket seatflow-realtime seatflow-notification seatflow-gateway)
          echo '=== EFFECTIVE STATE ==='
          for name in "${services[@]}"; do
            docker inspect --format '{{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} started={{.State.StartedAt}}' "${name}"
          done

          echo '=== EFFECTIVE HEALTH CONFIG ==='
          for name in seatflow-realtime seatflow-user seatflow-gateway; do
            echo "--- ${name}"
            docker inspect --format '{{json .Config.Healthcheck}}' "${name}"
          done

          echo '=== RESTARTED SERVICE ERROR SIGNALS ==='
          for name in seatflow-user seatflow-seatmap seatflow-event seatflow-reservation seatflow-payment seatflow-ticket seatflow-notification; do
            echo "--- ${name}"
            docker logs --tail 220 "${name}" 2>&1 \
              | redact \
              | grep -Ei 'error|exception|failed|fatal|shutdown|terminated|killed|started .* in|application run failed|connection refused|timeout' \
              | tail -60 || true
          done

          echo '=== REALTIME LOG SIGNALS ==='
          docker logs --tail 260 seatflow-realtime 2>&1 \
            | redact \
            | grep -Ei 'error|exception|failed|fatal|shutdown|terminated|killed|started .* in|application run failed|connection refused|timeout|kafka|eureka' \
            | tail -100 || true

          echo '=== REALTIME HEALTH HISTORY ==='
          docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}{{println "exit=" .ExitCode " start=" .Start " end=" .End " output=" .Output}}{{end}}{{end}}' seatflow-realtime | tail -12
          REMOTE
