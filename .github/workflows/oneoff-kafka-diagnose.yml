name: One-off - Smoke Test Stripe Webhook Delivery

on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  smoke-stripe-webhook:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Create Stripe sandbox payment and verify webhook receipt
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_VM_ZONE}" \
            --tunnel-through-iap --quiet \
            --command="sudo env GCP_PROJECT_ID='${GCP_PROJECT_ID}' bash -s" <<'REMOTE'
          set -euo pipefail

          stripe_key=$(gcloud secrets versions access latest \
            --secret=stripe-api-key --project="$GCP_PROJECT_ID")
          [[ $stripe_key == sk_test_* ]] || { echo 'refusing non-test Stripe key'; exit 1; }

          test_started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          response=$(curl -sS https://api.stripe.com/v1/payment_intents \
            -u "${stripe_key}:" \
            -d amount=200 \
            -d currency=ron \
            -d 'payment_method_types[]=card' \
            -d payment_method=pm_card_visa \
            -d confirm=true \
            --data-urlencode 'description=SeatFlow production webhook smoke test')
          unset stripe_key

          payment_intent_id=$(jq -r '.id // empty' <<<"$response")
          payment_status=$(jq -r '.status // empty' <<<"$response")
          [[ $payment_intent_id =~ ^pi_ ]] || {
            echo 'test PaymentIntent was not created successfully'
            jq -r '{type: .error.type, code: .error.code, message: .error.message}' <<<"$response"
            exit 1
          }
          echo "stripe_test_payment_intent=${payment_intent_id}"
          echo "stripe_test_payment_status=${payment_status}"
          [[ $payment_status == succeeded ]] || { echo 'test PaymentIntent did not succeed'; exit 1; }

          deadline=$((SECONDS + 120))
          matched=false
          while (( SECONDS < deadline )); do
            logs=$(docker logs --since "$test_started" seatflow-payment 2>&1 || true)
            if grep -Fq 'Processing Stripe webhook event. eventType=payment_intent.succeeded' <<<"$logs" \
              && grep -Fq "$payment_intent_id" <<<"$logs"; then
              matched=true
              break
            fi
            sleep 5
          done

          if [[ $matched != true ]]; then
            echo 'signed Stripe webhook was not observed in payment-service logs within 120s'
            docker logs --since "$test_started" seatflow-payment 2>&1 \
              | sed -E 's#(password|passwd|token|secret|api[_-]?key|authorization)[=:][^[:space:]]+#\1=[REDACTED]#Ig' \
              | grep -Ei 'Stripe webhook|payment_intent|signature|error|exception' \
              | tail -120 || true
            exit 1
          fi

          logs=$(docker logs --since "$test_started" seatflow-payment 2>&1 || true)
          if grep -Fq 'Invalid Stripe webhook signature verification failed' <<<"$logs"; then
            echo 'Stripe webhook signature validation failed'
            exit 1
          fi

          echo 'stripe_webhook_signature_validated=true'
          echo 'stripe_webhook_delivery_observed=true'
          echo 'stripe_webhook_event_type=payment_intent.succeeded'
          REMOTE
