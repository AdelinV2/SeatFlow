name: One-off - Diagnose Production Kafka

on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-kafka:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Probe gateway listener and Promtail primitives
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" --project="${GCP_PROJECT_ID}" --zone="${GCP_VM_ZONE}" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -u
          echo '=== GATEWAY STATE ==='
          docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} oom={{.State.OOMKilled}}' seatflow-gateway
          echo '=== GATEWAY LOCALHOST RESOLUTION ==='
          docker exec seatflow-gateway sh -c 'getent hosts localhost 2>/dev/null || cat /etc/hosts | grep localhost || true'
          echo '=== GATEWAY PORT 8080 LISTENER (/proc/net/tcp*) ==='
          docker exec seatflow-gateway sh -c "grep -Ei '(:1F90).* 0A ' /proc/net/tcp /proc/net/tcp6 2>/dev/null || true"
          echo '=== GATEWAY PROBE 127.0.0.1 ==='
          docker exec seatflow-gateway sh -c 'wget -S -O - -T 8 http://127.0.0.1:8080/actuator/health 2>&1 | head -40' || true
          echo '=== GATEWAY PROBE localhost ==='
          docker exec seatflow-gateway sh -c 'wget -S -O - -T 8 http://localhost:8080/actuator/health 2>&1 | head -40' || true
          echo '=== GATEWAY LOG TAIL ==='
          docker logs --tail 100 seatflow-gateway 2>&1 \
            | sed -E 's#(password|token|secret|api[_-]?key)=([^[:space:]]+)#\1=[REDACTED]#Ig' \
            | tail -100
          echo '=== PROMTAIL PRIMITIVES ==='
          docker exec seatflow-promtail sh -c 'for c in sh grep cat sed awk; do p=$(command -v "$c" 2>/dev/null || true); echo "$c=${p:-missing}"; done'
          echo '=== PROMTAIL 9080 LISTENER (/proc/net/tcp*) ==='
          docker exec seatflow-promtail sh -c "grep -Ei '(:2378).* 0A ' /proc/net/tcp /proc/net/tcp6 2>/dev/null || true"
          REMOTE
