name: One-off - Diagnose Production Kafka

on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-kafka:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Diagnose gateway and Promtail health
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" --project="${GCP_PROJECT_ID}" --zone="${GCP_VM_ZONE}" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -u
          echo '=== GATEWAY STATE ==='
          docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} error={{.State.Error}}' seatflow-gateway
          echo '=== GATEWAY HEALTH HISTORY ==='
          docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}{{println "exit=" .ExitCode " output=" .Output}}{{end}}{{end}}' seatflow-gateway | tail -12
          echo '=== GATEWAY FILTERED ERRORS ==='
          docker logs --tail 350 seatflow-gateway 2>&1 \
            | grep -Ei 'ERROR|Exception|Caused by|FATAL|OutOfMemory|Killed|connection refused|authentication failed|permission denied|does not exist|failed to|unable to|Redis|Kafka|Eureka|Bind|port|JWT|issuer|jwk' \
            | sed -E 's#(password|token|secret|api[_-]?key)=([^[:space:]]+)#\1=[REDACTED]#Ig' \
            | tail -90 || true
          echo '=== PROMTAIL PROCESS ==='
          docker inspect --format 'path={{.Path}} args={{json .Args}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' seatflow-promtail
          echo '=== PROMTAIL AVAILABLE COMMANDS ==='
          docker exec seatflow-promtail sh -c 'for c in promtail curl wget busybox nc netcat; do p=$(command -v "$c" 2>/dev/null || true); echo "$c=${p:-missing}"; done'
          echo '=== PROMTAIL VERSION PROBE ==='
          docker exec seatflow-promtail sh -c 'promtail -version 2>&1 || /usr/bin/promtail -version 2>&1 || true' | head -20
          REMOTE
