name: One-off - Diagnose Production Kafka

# snapshot-trigger: 2026-09-01T21:24Z
on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-kafka:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Inspect Eureka startup without mutations
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" --project="${GCP_PROJECT_ID}" --zone="${GCP_VM_ZONE}" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== RELEASE ==='
          grep '^SEATFLOW_IMAGE_TAG=' /run/seatflow/runtime.env 2>/dev/null || true
          echo '=== EUREKA STATE ==='
          docker inspect --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} oom={{.State.OOMKilled}} started={{.State.StartedAt}}' seatflow-eureka || true
          echo '=== EUREKA HEALTH HISTORY ==='
          docker inspect --format '{{range .State.Health.Log}}{{.Start}}|exit={{.ExitCode}}|{{printf "%q" .Output}}{{println}}{{end}}' seatflow-eureka 2>/dev/null | tail -10 || true
          echo '=== EUREKA LOG SIGNALS ==='
          docker logs --tail 160 seatflow-eureka 2>&1 \
            | sed -E 's#(password|passwd|token|secret|api[_-]?key|authorization)[=:][^[:space:]]+#\1=[REDACTED]#Ig' \
            | grep -Ei 'starting|started|tomcat|eureka|error|exception|failed|oom|outofmemory|killed|application' \
            | tail -100 || true
          echo '=== HOST MEMORY ==='
          free -m
          echo '=== CONTAINER MEMORY ==='
          docker stats --no-stream --format '{{.Name}}|{{.MemUsage}}|{{.CPUPerc}}' \
            | grep -E '^seatflow-(eureka|postgres|redis|kafka|otel-collector|tempo)\|' || true
          echo '=== KERNEL OOM SIGNALS ==='
          journalctl -k --since '15 minutes ago' --no-pager 2>/dev/null \
            | grep -Ei 'out of memory|oom-kill|killed process' \
            | tail -30 || true
          REMOTE
