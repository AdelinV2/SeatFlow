name: One-off - Identify Production Stripe Account

on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  identify-stripe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Identify Stripe account without exposing credentials
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_VM_ZONE}" \
            --tunnel-through-iap --quiet \
            --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail
          project_id=$(curl -fsS -H 'Metadata-Flavor: Google' \
            'http://metadata.google.internal/computeMetadata/v1/project/project-id')
          stripe_key=$(gcloud secrets versions access latest --secret=stripe-api-key --project="$project_id")
          if [[ $stripe_key == sk_test_* ]]; then
            echo 'stripe_key_mode=test'
          else
            echo 'stripe_key_mode=unexpected'
            exit 1
          fi

          account_json=$(curl -fsS -u "${stripe_key}:" https://api.stripe.com/v1/account)
          account_id=$(jq -r '.id // empty' <<<"$account_json")
          [[ $account_id =~ ^acct_ ]] || { echo 'stripe_account_id_invalid'; exit 1; }
          echo "stripe_account_id=${account_id}"

          if webhook_value=$(gcloud secrets versions access latest --secret=stripe-webhook-secret --project="$project_id" 2>/dev/null); then
            if [[ -n $webhook_value ]]; then
              echo 'stripe_webhook_secret_present=true'
            else
              echo 'stripe_webhook_secret_present=false'
            fi
          else
            echo 'stripe_webhook_secret_present=false'
          fi

          access_token=$(curl -fsS -H 'Metadata-Flavor: Google' \
            'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' \
            | jq -r '.access_token')
          permissions=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${access_token}" \
            -H 'Content-Type: application/json' \
            "https://secretmanager.googleapis.com/v1/projects/${project_id}/secrets/stripe-webhook-secret:testIamPermissions" \
            -d '{"permissions":["secretmanager.versions.access","secretmanager.versions.add"]}' \
            | jq -r '.permissions[]?' | sort | paste -sd, -)
          echo "stripe_webhook_secret_permissions=${permissions:-none}"
          REMOTE
