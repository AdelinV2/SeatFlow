name: One-off - Configure Production HTTPS

on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  configure-https:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Verify DNS and configure HTTPS edge
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_VM_ZONE}" \
            --tunnel-through-iap --quiet \
            --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== DNS RESOLUTION ==='
          for host in seat-flow.me www.seat-flow.me api.seat-flow.me; do
            printf '%s=' "$host"
            getent ahostsv4 "$host" | awk '{print $1}' | sort -u | paste -sd, - || true
          done

          echo '=== HTTPS CONFIGURATION ==='
          /opt/seatflow/infra/scripts/configure-https-edge.sh 'https://seat-flow.me/api/events?size=1'

          echo '=== TLS CERTIFICATE ==='
          openssl x509 -in /etc/letsencrypt/live/seat-flow.me/fullchain.pem -noout -subject -issuer -dates

          echo '=== PUBLIC HTTPS SMOKE ==='
          for url in \
            'https://seat-flow.me/' \
            'https://www.seat-flow.me/' \
            'https://api.seat-flow.me/api/events?size=1'; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
            echo "$url -> $status"
          done
          REMOTE
