name: One-off - Verify Stripe Secret Write Permission

on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  verify-secret-write:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Test Secret Manager write permission
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          access_token=$(gcloud auth print-access-token)
          permissions=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${access_token}" \
            -H 'Content-Type: application/json' \
            "https://secretmanager.googleapis.com/v1/projects/${GCP_PROJECT_ID}/secrets/stripe-webhook-secret:testIamPermissions" \
            -d '{"permissions":["secretmanager.versions.access","secretmanager.versions.add"]}' \
            | jq -r '.permissions[]?' | sort | paste -sd, -)
          echo "deploy_sa_stripe_webhook_secret_permissions=${permissions:-none}"
