name: One-off - Diagnose Production Kafka

# snapshot-trigger: 2026-09-01T21:28Z
on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-kafka:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Inspect migration progress without mutations
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" --project="${GCP_PROJECT_ID}" --zone="${GCP_VM_ZONE}" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== RELEASE ==='
          grep '^SEATFLOW_IMAGE_TAG=' /run/seatflow/runtime.env 2>/dev/null || true
          echo '=== DEPENDENCIES ==='
          for c in seatflow-postgres seatflow-redis seatflow-kafka seatflow-eureka; do
            docker inspect --format '{{.Name}}|status={{.State.Status}}|health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|restarts={{.RestartCount}}|oom={{.State.OOMKilled}}' "$c" 2>/dev/null | sed 's#^/##' || true
          done
          echo '=== MIGRATION MARKERS ==='
          find /opt/seatflow/deployment -maxdepth 1 -type f -name 'migrations-*.done' -printf '%f\n' 2>/dev/null | sort || true
          echo '=== MIGRATION CONTAINERS ==='
          docker ps -a --filter 'name=seatflow-migrate-' --format '{{.Names}}|{{.Status}}|{{.Image}}' | sort || true
          echo '=== MIGRATION LOG SIGNALS ==='
          while read -r name; do
            [[ -n ${name} ]] || continue
            echo "--- ${name}"
            docker logs --tail 120 "$name" 2>&1 \
              | sed -E 's#(password|passwd|token|secret|api[_-]?key|authorization)[=:][^[:space:]]+#\1=[REDACTED]#Ig' \
              | grep -Ei 'flyway|migration|schema .*up to date|successfully applied|error|exception|failed|started .*application' \
              | tail -80 || true
          done < <(docker ps -a --filter 'name=seatflow-migrate-' --format '{{.Names}}')
          echo '=== APP CONTAINERS ==='
          for c in seatflow-gateway seatflow-user seatflow-seatmap seatflow-event seatflow-reservation seatflow-payment seatflow-ticket seatflow-realtime seatflow-notification seatflow-frontend; do
            docker inspect --format '{{.Name}}|status={{.State.Status}}|health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|restarts={{.RestartCount}}|image={{.Config.Image}}' "$c" 2>/dev/null | sed 's#^/##' || true
          done
          REMOTE
