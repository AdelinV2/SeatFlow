name: One-off - Diagnose Production Kafka

# snapshot-trigger: 2026-09-01T21:22Z
on:
  push:
    branches: [ops/kafka-diagnose-20260901]

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-kafka:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Inspect release progress without mutations
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" --project="${GCP_PROJECT_ID}" --zone="${GCP_VM_ZONE}" --tunnel-through-iap --quiet --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail

          echo '=== RELEASE ==='
          grep '^SEATFLOW_IMAGE_TAG=' /run/seatflow/runtime.env 2>/dev/null || true
          echo '=== MIGRATION MARKERS ==='
          find /opt/seatflow/deployment -maxdepth 1 -type f -name 'migrations-*.done' -printf '%f\n' 2>/dev/null | sort || true
          echo '=== ACTIVE/RECENT MIGRATION CONTAINERS ==='
          docker ps -a --filter 'name=seatflow-migrate-' --format '{{.Names}}|{{.Status}}|{{.Image}}' | sort || true
          echo '=== SERVICE HEALTH ==='
          for c in seatflow-eureka seatflow-gateway seatflow-user seatflow-seatmap seatflow-event seatflow-reservation seatflow-payment seatflow-ticket seatflow-realtime seatflow-notification seatflow-frontend seatflow-otel-collector seatflow-tempo; do
            if docker inspect "$c" >/dev/null 2>&1; then
              docker inspect --format '{{.Name}}|status={{.State.Status}}|health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}|restarts={{.RestartCount}}|image={{.Config.Image}}' "$c" | sed 's#^/##'
            fi
          done
          echo '=== FINAL PROBES ==='
          docker exec seatflow-gateway wget -qO- http://127.0.0.1:8080/actuator/health/readiness 2>/dev/null | jq -c '{gateway_status: .status}' || true
          docker exec seatflow-eureka wget -qO- --header='Accept: application/json' http://127.0.0.1:8761/eureka/apps 2>/dev/null | jq -c '{eureka_registered: ((.applications.application // []) | length)}' || true
          printf 'frontend_status='
          docker exec seatflow-frontend wget -qSO /dev/null http://127.0.0.1:8080/health 2>&1 | awk '$1 ~ /^HTTP\// {print $2}' | tail -1 || true
          printf 'websocket_status='
          docker exec seatflow-frontend wget -qSO /dev/null --header='Connection: Upgrade' --header='Upgrade: websocket' http://127.0.0.1:8080/ws 2>&1 | awk '$1 ~ /^HTTP\// {print $2}' | tail -1 || true
          REMOTE
