name: One-off - Verify Frontend Hotfix

on:
  push:
    branches: [hotfix/stripe-publishable-key-frontend]

permissions:
  contents: read
  id-token: write

jobs:
  verify-frontend-hotfix:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to GCP with WIF
        uses: ./.github/actions/setup-gcp-wif
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Verify public frontend and deployed container
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_VM_NAME: ${{ vars.GCP_VM_NAME }}
          GCP_VM_ZONE: ${{ vars.GCP_VM_ZONE }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud compute ssh "${GCP_VM_NAME}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_VM_ZONE}" \
            --tunnel-through-iap --quiet \
            --command='sudo bash -s' <<'REMOTE'
          set -euo pipefail
          frontend_id=$(docker ps -q --filter name='^/seatflow-frontend$')
          [[ -n ${frontend_id} ]]
          echo "frontend_image=$(docker inspect --format '{{.Config.Image}}' "${frontend_id}")"
          echo "frontend_health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${frontend_id}")"
          echo "frontend_restarts=$(docker inspect --format '{{.RestartCount}}' "${frontend_id}")"
          echo "frontend_oom=$(docker inspect --format '{{.State.OOMKilled}}' "${frontend_id}")"

          env_body=$(curl -fsS https://seat-flow.me/env.js)
          grep -q 'STRIPE_PUBLISHABLE_KEY' <<<"${env_body}"
          grep -q 'pk_test_' <<<"${env_body}"
          ! grep -qi 'replace_with_your' <<<"${env_body}"
          echo 'public_env_configured=true'

          echo '--- public_headers ---'
          curl -fsSI https://seat-flow.me/ | tr -d '\r' \
            | grep -Ei '^(HTTP/|content-security-policy:|cache-control:|x-content-type-options:|x-frame-options:|referrer-policy:|permissions-policy:)'
          echo '--- local_headers ---'
          curl -fsSI http://127.0.0.1:8080/ | tr -d '\r' \
            | grep -Ei '^(HTTP/|content-security-policy:|cache-control:|x-content-type-options:|x-frame-options:|referrer-policy:|permissions-policy:)'

          public_status=$(curl -fsS -o /dev/null -w '%{http_code}' https://seat-flow.me/)
          echo "public_frontend_status=${public_status}"
          [[ ${public_status} == 200 ]]
          REMOTE
