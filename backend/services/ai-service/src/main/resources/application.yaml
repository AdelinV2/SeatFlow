spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: ai-service
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  ai:
    openai:
      # Groq OpenAI-compatible endpoint (Spring AI 2.0.1 property names, not 1.x).
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${GROQ_API_KEY:}
      chat:
        model: ${GROQ_MODEL:openai/gpt-oss-20b}
      # Bounded interactive policy: explicit timeout, no retry storm (mapper fails fast on 429).
      timeout: 15s
      max-retries: 0

server:
  port: 8090

seatflow:
  ai:
    enabled: ${AI_ENABLED:false}

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  opentelemetry:
    resource-attributes:
      "service.name": ${SEATFLOW_SERVICE_NAME:${spring.application.name}}
      "deployment.environment": ${SEATFLOW_DEPLOYMENT_ENV:local}
      "service.version": ${SEATFLOW_VERSION:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SEATFLOW_DEPLOYMENT_ENV:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
