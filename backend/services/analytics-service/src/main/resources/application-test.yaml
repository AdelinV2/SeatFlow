spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///seatflow_analytics_test
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${spring.kafka.bootstrap-servers:localhost:9092}
    consumer:
      group-id: analytics-service-v1-test
      auto-offset-reset: earliest
      enable-auto-commit: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://test-issuer.example.com

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    com.seatflow: WARN
