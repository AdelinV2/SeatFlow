spring:
  application:
    name: notification-service
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/mail/
    suffix: .html

server:
  port: 8088

ticket-service:
  base-url: ${TICKET_SERVICE_URL:http://ticket-service}

seatflow:
  resend:
    api-key: ${RESEND_API_KEY:re_dummy_test_key}
    from-email: ${RESEND_FROM_EMAIL:SeatFlow <onboarding@resend.dev>}
    api-url: ${RESEND_API_URL:https://api.resend.com}
    connect-timeout-ms: ${RESEND_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${RESEND_READ_TIMEOUT_MS:5000}
  notification:
    retry-interval-ms: ${NOTIFICATION_RETRY_INTERVAL_MS:30000}
    max-retries: ${NOTIFICATION_MAX_RETRIES:3}
    batch-size: ${NOTIFICATION_RETRY_BATCH_SIZE:50}
  mail:
    from: ${MAIL_FROM:SeatFlow Tickets <tickets@seat-flow.me>}
  kafka:
    topics:
      ticket-events: ${KAFKA_TOPIC_TICKET_EVENTS:seatflow.ticket.events}
      payment-events: ${KAFKA_TOPIC_PAYMENT_EVENTS:seatflow.payment.events}
      event-events: ${KAFKA_TOPIC_EVENT_EVENTS:seatflow.event.events}

resilience4j:
  circuitbreaker:
    instances:
      ticketService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignoreExceptions:
          - com.seatflow.common.domain.exception.ResourceNotFoundException
          - com.seatflow.common.domain.exception.ValidationException

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  opentelemetry:
    resource-attributes:
      "service.name": ${SEATFLOW_SERVICE_NAME:${spring.application.name}}
      "deployment.environment": ${SEATFLOW_DEPLOYMENT_ENV:local}
      "service.version": ${SEATFLOW_VERSION:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
