# Maven build / CI pipeline execution.
# Random port; Eureka client disabled so the context loads without a registry.
server:
  port: 0

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://seatflow.ciamlogin.com/test-tenant/v2.0
          jwk-set-uri: https://seatflow.ciamlogin.com/test-tenant/discovery/v2.0/keys

eureka:
  client:
    enabled: false

seatflow:
  cors:
    allowed-origins: http://localhost:4200
