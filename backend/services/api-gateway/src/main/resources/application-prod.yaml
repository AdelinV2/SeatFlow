# GCP Cloud Run / GKE (Staging & Production)
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

seatflow:
  observability:
    service-name: ${SEATFLOW_SERVICE_NAME:${spring.application.name}}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://seatflow.app}

logging:
  config: classpath:logback-spring.xml

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  opentelemetry:
    resource-attributes:
      "service.name": ${SEATFLOW_SERVICE_NAME:${spring.application.name}}
      "deployment.environment": ${SEATFLOW_DEPLOYMENT_ENV:prod}
      "service.version": ${SEATFLOW_VERSION:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
  endpoint:
    health:
      show-details: never
