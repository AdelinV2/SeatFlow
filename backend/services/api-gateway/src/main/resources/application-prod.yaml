# GCP Cloud Run / GKE (Staging & Production)
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

seatflow:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://seatflow.app}

management:
  endpoint:
    health:
      show-details: never
