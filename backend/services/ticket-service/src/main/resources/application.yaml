spring:
  application:
    name: ticket-service
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8086

event-service:
  base-url: ${EVENT_SERVICE_URL:http://event-service}

reservation-service:
  base-url: ${RESERVATION_SERVICE_URL:http://reservation-service}

seat-map-service:
  base-url: ${SEAT_MAP_SERVICE_URL:http://seat-map-service}

resilience4j:
  circuitbreaker:
    instances:
      eventService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignoreExceptions:
          - com.seatflow.common.domain.exception.ResourceNotFoundException
          - com.seatflow.common.domain.exception.ValidationException
      reservationService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignoreExceptions:
          - com.seatflow.common.domain.exception.ResourceNotFoundException
          - com.seatflow.common.domain.exception.ValidationException
      seatMapService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignoreExceptions:
          - com.seatflow.common.domain.exception.ResourceNotFoundException
          - com.seatflow.common.domain.exception.ValidationException

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

outbox:
  publisher:
    fixed-delay-ms: 3000
    batch-size: 50
    topic: seatflow.ticket.events
