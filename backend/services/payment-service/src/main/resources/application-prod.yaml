spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:seatflow_payment}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      enable-idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}
          audiences: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES}

stripe:
  api-key: ${STRIPE_API_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

reservation-service:
  base-url: ${RESERVATION_SERVICE_URL:http://reservation-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true

seatflow:
  observability:
    service-name: ${SEATFLOW_SERVICE_NAME:${spring.application.name}}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  config: classpath:logback-spring.xml
  level:
    com.seatflow: INFO
    org.hibernate.SQL: WARN
management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.2}
  opentelemetry:
    resource-attributes:
      "service.name": ${SEATFLOW_SERVICE_NAME:${spring.application.name}}
      "deployment.environment": ${SEATFLOW_DEPLOYMENT_ENV:prod}
      "service.version": ${SEATFLOW_VERSION:dev}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
  endpoint:
    health:
      show-details: never
