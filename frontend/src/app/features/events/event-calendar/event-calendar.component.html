<div class="calendar-container rounded-2xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4 shadow-sm md:p-6">
  <!-- Month Header Controls -->
  <div class="mb-5 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="prevMonth()"
        class="btn-spring flex size-9 items-center justify-center rounded-xl border border-[var(--color-border)] bg-[var(--color-surface-elevated)] text-[var(--color-text-secondary)] hover:text-[var(--color-primary-hover)] cursor-pointer"
        aria-label="Previous month"
      >
        ‹
      </button>
      <h3 class="text-base font-bold capitalize text-[var(--color-text-primary)] md:text-lg">
        {{ formattedMonthHeader() }}
      </h3>
      <button
        type="button"
        (click)="nextMonth()"
        class="btn-spring flex size-9 items-center justify-center rounded-xl border border-[var(--color-border)] bg-[var(--color-surface-elevated)] text-[var(--color-text-secondary)] hover:text-[var(--color-primary-hover)] cursor-pointer"
        aria-label="Next month"
      >
        ›
      </button>
    </div>

    <div class="flex items-center gap-3">
      <!-- Calendar Legend -->
      <div class="hidden sm:flex items-center gap-3 text-[11px] text-[var(--color-text-muted)] font-medium">
        <span class="flex items-center gap-1.5">
          <span class="size-2 rounded-full bg-indigo-600 ring-2 ring-indigo-400/40"></span>
          <span>Today</span>
        </span>
        <span class="flex items-center gap-1.5">
          <span class="size-2 rounded-full bg-slate-500/40"></span>
          <span>Past</span>
        </span>
      </div>

      @if (selectedDate()) {
        <button
          type="button"
          (click)="clearSelection()"
          class="text-xs font-semibold text-indigo-500 hover:text-indigo-400 hover:underline cursor-pointer"
        >
          Clear Date Filter
        </button>
      }
    </div>
  </div>

  <!-- Weekday Columns Header -->
  <div class="mb-2 grid grid-cols-7 gap-1 text-center text-xs font-bold uppercase tracking-wider text-[var(--color-text-muted)]">
    @for (label of weekDayLabels; track label) {
      <div class="py-1">{{ label }}</div>
    }
  </div>

  <!-- Desktop Full Grid View (>= 768px) -->
  <div class="hidden grid-cols-7 gap-1.5 md:grid" role="grid" aria-label="Event calendar desktop grid">
    @for (day of calendarDays(); track day.date.toISOString()) {
      <button
        type="button"
        (click)="selectDay(day)"
        class="flex min-h-[96px] flex-col justify-between rounded-xl border p-2 text-left transition-all duration-200 cursor-pointer select-none"
        [ngClass]="[
          !day.isCurrentMonth
            ? 'border-transparent bg-transparent opacity-20 pointer-events-none'
            : day.isToday
              ? 'border-indigo-500/70 bg-indigo-500/10 ring-1 ring-indigo-500/40 shadow-sm'
              : day.isPast
                ? 'border-[var(--color-border-subtle)] bg-[var(--color-canvas)]/50 opacity-45 hover:opacity-85 hover:border-slate-500/40'
                : 'border-[var(--color-border)] bg-[var(--color-canvas)] hover:border-indigo-400/50 hover:bg-[var(--color-surface-elevated)]',
          day.isSelected
            ? '!border-indigo-500 !bg-indigo-500/20 ring-2 ring-indigo-500 shadow-md'
            : ''
        ]"
        [attr.aria-label]="day.dayNumber + (day.isToday ? ', Today' : '') + (day.events.length ? ', ' + day.events.length + ' events' : '')"
        [attr.aria-selected]="day.isSelected"
      >
        <!-- Day Number & Today Badge Row -->
        <div class="flex items-center justify-between w-full">
          @if (day.isToday) {
            <span class="inline-flex size-6 items-center justify-center rounded-full bg-gradient-to-tr from-indigo-600 to-violet-600 text-xs font-black text-white shadow-md shadow-indigo-600/40 ring-2 ring-indigo-400/50">
              {{ day.dayNumber }}
            </span>
            <span class="rounded bg-indigo-500/20 px-1.5 py-0.5 text-[9px] font-extrabold uppercase tracking-wider text-indigo-700 dark:text-indigo-300">
              Today
            </span>
          } @else {
            <span
              class="text-xs"
              [ngClass]="[
                day.isPast ? 'text-[var(--color-text-muted)] font-normal' : 'text-[var(--color-text-primary)] font-bold'
              ]"
            >
              {{ day.dayNumber }}
            </span>
            @if (day.isPast && day.isCurrentMonth) {
              <span class="text-[9px] text-[var(--color-text-muted)] opacity-60">Past</span>
            }
          }
        </div>

        <!-- Event Chips -->
        <div class="w-full space-y-1 overflow-hidden mt-1">
          @for (event of day.events.slice(0, 2); track event.id) {
            <div
              class="truncate rounded border px-1.5 py-0.5 text-[10px] font-semibold transition-opacity"
              [ngClass]="[
                day.isPast
                  ? 'border-slate-500/20 bg-slate-500/10 text-[var(--color-text-muted)] opacity-75'
                  : 'border-indigo-500/30 bg-indigo-500/20 text-indigo-700 dark:text-indigo-300'
              ]"
              [title]="event.title"
            >
              {{ event.title }}
            </div>
          }
          @if (day.events.length > 2) {
            <span class="block text-[9px] font-bold text-[var(--color-text-muted)]">
              +{{ day.events.length - 2 }} more
            </span>
          }
        </div>
      </button>
    }
  </div>

  <!-- Mobile Dot Matrix View (< 768px) -->
  <div class="grid grid-cols-7 gap-1 text-center md:hidden" role="grid" aria-label="Event calendar mobile grid">
    @for (day of calendarDays(); track day.date.toISOString()) {
      <button
        type="button"
        (click)="selectDay(day)"
        class="flex flex-col items-center justify-center rounded-xl py-2 transition-all duration-200 cursor-pointer"
        [ngClass]="[
          !day.isCurrentMonth ? 'opacity-20 pointer-events-none' : '',
          day.isSelected
            ? 'bg-indigo-600 text-white shadow-md'
            : day.isPast && !day.isToday
              ? 'opacity-40 text-[var(--color-text-muted)] hover:bg-[var(--color-surface-elevated)]'
              : 'text-[var(--color-text-primary)] hover:bg-[var(--color-surface-elevated)]'
        ]"
        [attr.aria-label]="day.dayNumber + (day.isToday ? ', Today' : '') + (day.events.length ? ', ' + day.events.length + ' events' : '')"
        [attr.aria-selected]="day.isSelected"
      >
        @if (day.isToday && !day.isSelected) {
          <span class="flex size-7 items-center justify-center rounded-full bg-indigo-600 font-black text-xs text-white shadow-md shadow-indigo-600/40 ring-2 ring-indigo-400/50">
            {{ day.dayNumber }}
          </span>
        } @else {
          <span class="text-xs font-semibold">{{ day.dayNumber }}</span>
        }

        @if (day.events.length > 0) {
          <span
            class="mt-1 size-1.5 rounded-full"
            [ngClass]="day.isSelected ? 'bg-white' : day.isPast ? 'bg-slate-400' : 'bg-indigo-500 animate-pulse'"
          ></span>
        } @else {
          <span class="mt-1 size-1.5"></span>
        }
      </button>
    }
  </div>
</div>
