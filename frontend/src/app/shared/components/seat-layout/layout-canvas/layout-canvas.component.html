<div
  #svgContainer
  class="layout-canvas-container relative w-full h-full overflow-hidden select-none"
>
  <!-- Top-Left Tool Mode Toolbar (Select, Quick Toggle, Paint) -->
  @if (editable()) {
    <div
      class="canvas-mode-toolbar absolute top-4 left-4 z-20 flex items-center gap-1 p-1.5 rounded-2xl bg-slate-900/90 backdrop-blur-md border border-slate-700/70 shadow-xl"
      role="toolbar"
      aria-label="Canvas Editing Tools"
    >
      <!-- Select / Transform Tool -->
      <button
        type="button"
        (click)="setToolMode('select')"
        [class.active-mode]="currentMode() === 'select'"
        [class.bg-indigo-600]="currentMode() === 'select'"
        [class.text-white]="currentMode() === 'select'"
        [class.text-slate-300]="currentMode() !== 'select'"
        class="mode-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all hover:text-white hover:bg-slate-800"
        title="Select & Transform Mode (Click to select, double-click to toggle)"
        aria-label="Select mode"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
          <path d="m13 13 6 6" />
        </svg>
        <span>Select</span>
      </button>

      <!-- Quick Toggle Tool (Active <-> Aisle) -->
      <button
        type="button"
        (click)="setToolMode('toggle')"
        [class.active-mode]="currentMode() === 'toggle'"
        [class.bg-amber-600]="currentMode() === 'toggle'"
        [class.text-white]="currentMode() === 'toggle'"
        [class.text-slate-300]="currentMode() !== 'toggle'"
        class="mode-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all hover:text-white hover:bg-slate-800"
        title="Quick Toggle Mode (Click any seat to toggle Active ↔ Aisle)"
        aria-label="Quick toggle mode"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </svg>
        <span>Quick Toggle</span>
      </button>

      <!-- Paint Tool -->
      <button
        type="button"
        (click)="setToolMode('paint')"
        [class.active-mode]="currentMode() === 'paint'"
        [class.bg-violet-600]="currentMode() === 'paint'"
        [class.text-white]="currentMode() === 'paint'"
        [class.text-slate-300]="currentMode() !== 'paint'"
        class="mode-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all hover:text-white hover:bg-slate-800"
        title="Color Paintbrush Mode (Click seats to apply selected color)"
        aria-label="Paint mode"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m14 12 4 4" />
          <path d="M18 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3" />
          <path d="M4 14a2 2 0 0 0 2 2h4" />
          <path d="M4 4h10v10H4z" />
        </svg>
        <span>Paint</span>
      </button>
    </div>
  }

  <!-- Accessible Floating Control Toolbar (Min 44x44px touch targets) -->
  <div
    class="canvas-toolbar absolute bottom-4 right-4 z-20 flex items-center gap-1.5 p-1.5 rounded-2xl bg-slate-900/85 backdrop-blur-md border border-slate-700/60 shadow-xl"
    role="toolbar"
    aria-label="Canvas Navigation Controls"
  >
    <!-- Zoom Out -->
    <button
      type="button"
      (click)="zoomOut()"
      class="toolbar-btn min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/80 active:scale-95 transition-all outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      aria-label="Zoom out"
      title="Zoom out"
    >
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>

    <!-- Zoom Percentage Display / Reset Button -->
    <button
      type="button"
      (click)="resetView()"
      class="toolbar-btn min-w-[44px] min-h-[44px] px-2 flex items-center justify-center rounded-xl font-mono text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800/80 active:scale-95 transition-all outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      aria-label="Reset zoom to 100%"
      title="Reset zoom to 100%"
    >
      {{ zoomLevel() * 100 | number: '1.0-0' }}%
    </button>

    <!-- Zoom In -->
    <button
      type="button"
      (click)="zoomIn()"
      class="toolbar-btn min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/80 active:scale-95 transition-all outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      aria-label="Zoom in"
      title="Zoom in"
    >
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>

    <!-- Divider -->
    <div class="w-px h-6 bg-slate-700/60 my-auto"></div>

    <!-- Fit to Layout -->
    <button
      type="button"
      (click)="fitToLayout()"
      class="toolbar-btn min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/80 active:scale-95 transition-all outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      aria-label="Fit venue layout to screen"
      title="Fit venue layout to screen"
    >
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path
          d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
        />
      </svg>
    </button>
  </div>

  <!-- Bottom-Left Floating Legend & Shortcut Hints -->
  <div
    class="canvas-legend absolute bottom-4 left-4 z-20 flex flex-wrap items-center gap-3 px-3.5 py-2 rounded-2xl bg-slate-900/85 backdrop-blur-md border border-slate-700/60 shadow-xl text-[11px] text-slate-300 pointer-events-none"
  >
    <div class="flex items-center gap-1.5">
      <span class="size-2.5 rounded-full bg-indigo-500 shadow-xs"></span>
      <span class="font-medium">Active Seat</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="size-2.5 rounded-sm border border-dashed border-slate-400"></span>
      <span class="font-medium">Aisle / Walkway</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="size-2.5 rounded-full border-2 border-amber-400"></span>
      <span class="font-medium">Selected</span>
    </div>
    <span class="text-slate-600 hidden sm:inline">•</span>
    <span class="text-slate-400 hidden sm:inline">Double-click or Alt+click to toggle seat</span>
  </div>

  <!-- SVG Viewport with Pan and Zoom Canvas -->
  <svg
    #svgViewport
    class="layout-canvas-svg w-full h-full block cursor-grab active:cursor-grabbing touch-none"
    [class.cursor-move]="isDragging()"
    (pointerdown)="onCanvasPointerDown($event)"
    (pointermove)="onCanvasPointerMove($event)"
    (pointerup)="onCanvasPointerUp($event)"
    (pointercancel)="onCanvasPointerCancel($event)"
    (lostpointercapture)="onCanvasLostPointerCapture($event)"
    role="region"
    aria-label="Venue Seat Map Canvas"
  >
    <defs>
      <!-- Modern Dot/Grid pattern for aesthetic background -->
      <pattern id="canvas-grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="1" fill="rgba(255, 255, 255, 0.08)" />
        <path
          d="M 40 0 L 0 0 0 40"
          fill="none"
          stroke="rgba(255, 255, 255, 0.03)"
          stroke-width="1"
        />
      </pattern>
    </defs>

    <!-- Canvas Background Rect -->
    <rect class="canvas-bg" width="100%" height="100%" fill="url(#canvas-grid-pattern)" />

    <!-- Viewport Content Group (Transformed by pan and zoom) -->
    <g class="viewport-content" [attr.transform]="viewportTransform()">
      @for (item of sortedItems(); track item.stableKey) {
        @if (item.kind === 'section') {
          <g
            app-section-node
            [section]="$any(item.data)"
            [selected]="selectedIdSet().has($any(item.data).draftKey ?? item.data.sectionId ?? '')"
            [editable]="editable()"
            [snapStep]="snapStep()"
            [toolMode]="currentMode()"
            [paintColor]="paintColor()"
            [selectedSeatKeys]="selectedSeatKeys()"
            (sectionClick)="onSectionClick($event)"
            (sectionPointerDown)="onSectionPointerDown($event)"
            (handlePointerDown)="onHandlePointerDown($event)"
            (seatClick)="onSeatClick($event)"
            (seatToggle)="onSeatToggle($event)"
            (seatPaint)="onSeatPaint($event)"
            (rowClick)="onRowClick($event)"
            (rowDblClick)="onRowDblClick($event)"
            (colClick)="onColClick($event)"
            (colDblClick)="onColDblClick($event)"
          ></g>
        } @else {
          <!-- Layout Elements: STAGE, AISLE, LABEL, BARRIER, DECORATION -->
          <g
            class="layout-element"
            [class]="'element-' + item.data.type.toLowerCase()"
            [attr.transform]="getElementTransform(item.data)"
            role="img"
            [attr.aria-label]="item.data.label || item.data.type"
          >
            @switch (item.data.type) {
              @case ('STAGE') {
                <rect
                  class="stage-rect"
                  x="0"
                  y="0"
                  [attr.width]="item.data.geometry.width"
                  [attr.height]="item.data.geometry.height"
                  rx="10"
                  ry="10"
                />
                <text
                  class="stage-title"
                  [attr.x]="item.data.geometry.width / 2"
                  [attr.y]="item.data.geometry.height / 2"
                  text-anchor="middle"
                  dominant-baseline="middle"
                >
                  {{ item.data.label || 'STAGE' }}
                </text>
              }
              @case ('AISLE') {
                <rect
                  class="aisle-rect"
                  x="0"
                  y="0"
                  [attr.width]="item.data.geometry.width"
                  [attr.height]="item.data.geometry.height"
                  rx="4"
                  ry="4"
                />
                @if (item.data.label) {
                  <text
                    class="aisle-title"
                    [attr.x]="item.data.geometry.width / 2"
                    [attr.y]="item.data.geometry.height / 2"
                    text-anchor="middle"
                    dominant-baseline="middle"
                  >
                    {{ item.data.label }}
                  </text>
                }
              }
              @case ('LABEL') {
                <text
                  class="standalone-label"
                  [attr.x]="item.data.geometry.width / 2"
                  [attr.y]="item.data.geometry.height / 2"
                  text-anchor="middle"
                  dominant-baseline="middle"
                >
                  {{ item.data.label }}
                </text>
              }
              @case ('BARRIER') {
                <rect
                  class="barrier-rect"
                  x="0"
                  y="0"
                  [attr.width]="item.data.geometry.width"
                  [attr.height]="item.data.geometry.height"
                />
              }
              @default {
                <rect
                  class="decoration-rect"
                  x="0"
                  y="0"
                  [attr.width]="item.data.geometry.width"
                  [attr.height]="item.data.geometry.height"
                  rx="4"
                />
              }
            }
          </g>
        }
      }
    </g>
  </svg>
</div>
