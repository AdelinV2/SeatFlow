<div
  #svgContainer
  class="layout-canvas-container relative w-full h-full overflow-hidden select-none"
>
  <!-- Top-Left Toolbars (Tools & Layout Element Palette) -->
  @if (editable()) {
    <div
      class="absolute top-4 left-4 z-20 flex flex-wrap items-center gap-2 max-w-[calc(100%-2rem)]"
    >
      <!-- Section & Seat Tools (Select, Quick Toggle, Paint) -->
      <div
        class="canvas-mode-toolbar flex items-center gap-1 p-1.5 rounded-2xl bg-slate-900/90 backdrop-blur-md border border-slate-700/70 shadow-xl"
        role="toolbar"
        aria-label="Canvas Editing Tools"
      >
        <!-- Select / Transform Tool -->
        <button
          type="button"
          (click)="setToolMode('select')"
          [class.active-mode]="currentMode() === 'select'"
          [class.bg-indigo-600]="currentMode() === 'select'"
          [class.text-white]="currentMode() === 'select'"
          [class.text-slate-300]="currentMode() !== 'select'"
          class="mode-btn min-h-[44px] min-w-[44px] flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all hover:text-white hover:bg-slate-800 outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
          title="Select & Transform Mode (Click to select, double-click to toggle)"
          aria-label="Select mode"
        >
          <svg
            class="size-4 shrink-0"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
            <path d="m13 13 6 6" />
          </svg>
          <span class="hidden sm:inline">Select</span>
        </button>

        <!-- Quick Toggle Tool (Active <-> Aisle) -->
        <button
          type="button"
          (click)="setToolMode('toggle')"
          [class.active-mode]="currentMode() === 'toggle'"
          [class.bg-amber-600]="currentMode() === 'toggle'"
          [class.text-white]="currentMode() === 'toggle'"
          [class.text-slate-300]="currentMode() !== 'toggle'"
          class="mode-btn min-h-[44px] min-w-[44px] flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all hover:text-white hover:bg-slate-800 outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
          title="Quick Toggle Mode (Click any seat to toggle Active ↔ Aisle)"
          aria-label="Quick toggle mode"
        >
          <svg
            class="size-4 shrink-0"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
          <span class="hidden sm:inline">Toggle</span>
        </button>

        <!-- Paint Tool -->
        <button
          type="button"
          (click)="setToolMode('paint')"
          [class.active-mode]="currentMode() === 'paint'"
          [class.bg-violet-600]="currentMode() === 'paint'"
          [class.text-white]="currentMode() === 'paint'"
          [class.text-slate-300]="currentMode() !== 'paint'"
          class="mode-btn min-h-[44px] min-w-[44px] flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition-all hover:text-white hover:bg-slate-800 outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
          title="Color Paintbrush Mode (Click seats to apply selected color)"
          aria-label="Paint mode"
        >
          <svg
            class="size-4 shrink-0"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="m14 12 4 4" />
            <path d="M18 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3" />
            <path d="M4 14a2 2 0 0 0 2 2h4" />
            <path d="M4 4h10v10H4z" />
          </svg>
          <span class="hidden sm:inline">Paint</span>
        </button>
      </div>

      <!-- Layout Element Palette -->
      <app-layout-element-palette
        [existingElements]="internalElements()"
        [existingSections]="sections()"
        (elementCreated)="onElementCreatedFromPalette($event)"
      />
    </div>
  }

  <!-- Floating Inspector Panel for Selected Layout Element (Accessible form alternatives) -->
  @if (editable() && selectedElement(); as selElem) {
    <div
      class="element-inspector-panel absolute top-20 right-4 z-20 flex flex-col gap-2.5 p-3.5 rounded-2xl bg-slate-900/95 backdrop-blur-md border border-slate-700/70 shadow-2xl text-xs text-slate-200 w-72"
      role="region"
      aria-label="Element Properties"
    >
      <!-- Header: Type & Close -->
      <div class="flex items-center justify-between gap-2 border-b border-slate-700/60 pb-2">
        <span
          class="font-bold tracking-wider text-indigo-400 uppercase text-[11px] flex items-center gap-1.5"
        >
          <span class="size-2 rounded-full bg-indigo-400"></span>
          {{ selElem.type }} ELEMENT
        </span>
        <button
          type="button"
          (click)="deselectElement()"
          class="min-h-[36px] min-w-[36px] flex items-center justify-center rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
          aria-label="Close element inspector"
        >
          <svg
            class="size-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <!-- Validation Error Banner -->
      @if (elementValidationError()) {
        <div
          role="alert"
          class="element-validation-error px-2.5 py-1.5 rounded-lg bg-rose-950/80 border border-rose-500/60 text-rose-300 text-[11px] font-medium"
        >
          {{ elementValidationError() }}
        </div>
      }

      <!-- Label Input Form Alternative -->
      <div class="flex flex-col gap-1">
        <label
          for="element-label-input"
          class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider"
        >
          Label {{ selElem.type === 'LABEL' ? '(Required)' : '(Optional)' }}
        </label>
        <input
          id="element-label-input"
          type="text"
          [value]="selElem.label || ''"
          (input)="onLabelInput($event)"
          (change)="onLabelChange($event)"
          placeholder="Enter element label..."
          class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-600/60 text-white text-xs outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
        />
      </div>

      <!-- Numeric Form Alternatives (X, Y, Width, Height, Rotation, Z-Index) -->
      <div class="grid grid-cols-2 gap-2">
        <div class="flex flex-col gap-0.5">
          <label for="element-x-input" class="text-[10px] text-slate-400 font-mono"
            >X Position</label
          >
          <input
            id="element-x-input"
            type="number"
            min="0"
            max="100000"
            [value]="selElem.geometry.x"
            (change)="onNumericParamChange('x', $event)"
            class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-white font-mono text-xs focus:border-indigo-500 outline-none"
            aria-label="Element X Position"
          />
        </div>
        <div class="flex flex-col gap-0.5">
          <label for="element-y-input" class="text-[10px] text-slate-400 font-mono"
            >Y Position</label
          >
          <input
            id="element-y-input"
            type="number"
            min="0"
            max="100000"
            [value]="selElem.geometry.y"
            (change)="onNumericParamChange('y', $event)"
            class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-white font-mono text-xs focus:border-indigo-500 outline-none"
            aria-label="Element Y Position"
          />
        </div>
        <div class="flex flex-col gap-0.5">
          <label for="element-w-input" class="text-[10px] text-slate-400 font-mono">Width</label>
          <input
            id="element-w-input"
            type="number"
            min="0.001"
            max="100000"
            [value]="selElem.geometry.width"
            (change)="onNumericParamChange('width', $event)"
            class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-white font-mono text-xs focus:border-indigo-500 outline-none"
            aria-label="Element Width"
          />
        </div>
        <div class="flex flex-col gap-0.5">
          <label for="element-h-input" class="text-[10px] text-slate-400 font-mono">Height</label>
          <input
            id="element-h-input"
            type="number"
            min="0.001"
            max="100000"
            [value]="selElem.geometry.height"
            (change)="onNumericParamChange('height', $event)"
            class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-white font-mono text-xs focus:border-indigo-500 outline-none"
            aria-label="Element Height"
          />
        </div>
        <div class="flex flex-col gap-0.5">
          <label for="element-rot-input" class="text-[10px] text-slate-400 font-mono"
            >Rotation (°)</label
          >
          <input
            id="element-rot-input"
            type="number"
            min="-180"
            max="180"
            [value]="selElem.geometry.rotationDeg"
            (change)="onNumericParamChange('rotationDeg', $event)"
            class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-white font-mono text-xs focus:border-indigo-500 outline-none"
            aria-label="Element Rotation Degrees"
          />
        </div>
        <div class="flex flex-col gap-0.5">
          <label for="element-z-input" class="text-[10px] text-slate-400 font-mono">Z-Index</label>
          <input
            id="element-z-input"
            type="number"
            min="-1000"
            max="1000"
            [value]="selElem.zIndex"
            (change)="onNumericParamChange('zIndex', $event)"
            class="px-2 py-1 rounded bg-slate-800 border border-slate-700 text-white font-mono text-xs focus:border-indigo-500 outline-none"
            aria-label="Element Z-Index"
          />
        </div>
      </div>

      <!-- Action Buttons (Min 44x44px Targets) -->
      <div class="flex items-center gap-2 pt-2 border-t border-slate-700/60">
        <button
          type="button"
          (click)="duplicateSelectedElement()"
          class="min-w-[44px] min-h-[44px] flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white font-semibold text-xs transition-colors outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
          aria-label="Duplicate element"
          title="Duplicate element (creates copy with 20-unit clamped offset and null ID)"
        >
          <svg
            class="size-4 shrink-0"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          <span>Duplicate</span>
        </button>

        <button
          type="button"
          (click)="removeSelectedElement()"
          class="min-w-[44px] min-h-[44px] flex items-center justify-center px-3 py-2 rounded-xl bg-rose-950/60 hover:bg-rose-900 border border-rose-700/50 text-rose-300 hover:text-white font-semibold text-xs transition-colors outline-none focus-visible:ring-2 focus-visible:ring-rose-500"
          aria-label="Remove element from draft"
          title="Remove element from draft"
        >
          <svg
            class="size-4 shrink-0"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"
            />
          </svg>
        </button>
      </div>
    </div>
  }

  <!-- Accessible Floating Control Toolbar (Min 44x44px touch targets) -->
  <div
    class="canvas-toolbar absolute bottom-4 right-4 z-20 flex items-center gap-1.5 p-1.5 rounded-2xl bg-slate-900/85 backdrop-blur-md border border-slate-700/60 shadow-xl"
    role="toolbar"
    aria-label="Canvas Navigation Controls"
  >
    <!-- Zoom Out -->
    <button
      type="button"
      (click)="zoomOut()"
      class="toolbar-btn min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/80 active:scale-95 transition-all outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      aria-label="Zoom out"
      title="Zoom out"
    >
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>

    <!-- Zoom Percentage Display / Reset Button -->
    <button
      type="button"
      (click)="resetView()"
      class="toolbar-btn min-w-[44px] min-h-[44px] px-2 flex items-center justify-center rounded-xl font-mono text-xs font-bold text-slate-300 hover:text-white hover:bg-slate-800/80 active:scale-95 transition-all outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      aria-label="Reset zoom to 100%"
      title="Reset zoom to 100%"
    >
      {{ zoomLevel() * 100 | number: '1.0-0' }}%
    </button>

    <!-- Zoom In -->
    <button
      type="button"
      (click)="zoomIn()"
      class="toolbar-btn min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/80 active:scale-95 transition-all outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      aria-label="Zoom in"
      title="Zoom in"
    >
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>

    <!-- Divider -->
    <div class="w-px h-6 bg-slate-700/60 my-auto"></div>

    <!-- Fit to Layout -->
    <button
      type="button"
      (click)="fitToLayout()"
      class="toolbar-btn min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/80 active:scale-95 transition-all outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
      aria-label="Fit venue layout to screen"
      title="Fit venue layout to screen"
    >
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path
          d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
        />
      </svg>
    </button>
  </div>

  <!-- Bottom-Left Floating Legend & Shortcut Hints -->
  <div
    class="canvas-legend absolute bottom-4 left-4 z-20 flex flex-wrap items-center gap-3 px-3.5 py-2 rounded-2xl bg-slate-900/85 backdrop-blur-md border border-slate-700/60 shadow-xl text-[11px] text-slate-300 pointer-events-none"
  >
    <div class="flex items-center gap-1.5">
      <span class="size-2.5 rounded-full bg-indigo-500 shadow-xs"></span>
      <span class="font-medium">Active Seat</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="size-2.5 rounded-sm border border-dashed border-slate-400"></span>
      <span class="font-medium">Aisle / Walkway</span>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="size-2.5 rounded-full border-2 border-amber-400"></span>
      <span class="font-medium">Selected</span>
    </div>
    <span class="text-slate-600 hidden sm:inline">•</span>
    <span class="text-slate-400 hidden sm:inline">Double-click or Alt+click to toggle seat</span>
  </div>

  <!-- SVG Viewport with Pan and Zoom Canvas -->
  <svg
    #svgViewport
    class="layout-canvas-svg w-full h-full block cursor-grab active:cursor-grabbing touch-none"
    [class.cursor-move]="isDragging()"
    (pointerdown)="onCanvasPointerDown($event)"
    (pointermove)="onCanvasPointerMove($event)"
    (pointerup)="onCanvasPointerUp($event)"
    (pointercancel)="onCanvasPointerCancel($event)"
    (lostpointercapture)="onCanvasLostPointerCapture($event)"
    role="region"
    aria-label="Venue Seat Map Canvas"
  >
    <defs>
      <!-- Modern Dot/Grid pattern for background -->
      <pattern id="canvas-grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="20" cy="20" r="1" fill="rgba(255, 255, 255, 0.08)" />
        <path
          d="M 40 0 L 0 0 0 40"
          fill="none"
          stroke="rgba(255, 255, 255, 0.03)"
          stroke-width="1"
        />
      </pattern>
    </defs>

    <!-- Canvas Background Rect -->
    <rect class="canvas-bg" width="100%" height="100%" fill="url(#canvas-grid-pattern)" />

    <!-- Viewport Content Group (Transformed by pan and zoom) -->
    <g class="viewport-content" [attr.transform]="viewportTransform()">
      @for (item of sortedItems(); track item.stableKey) {
        @if (item.kind === 'section') {
          <g
            app-section-node
            [section]="$any(item.data)"
            [selected]="selectedIdSet().has($any(item.data).draftKey ?? item.data.sectionId ?? '')"
            [editable]="editable()"
            [snapStep]="snapStep()"
            [toolMode]="currentMode()"
            [paintColor]="paintColor()"
            [selectedSeatKeys]="selectedSeatKeys()"
            (sectionClick)="onSectionClick($event)"
            (sectionPointerDown)="onSectionPointerDown($event)"
            (handlePointerDown)="onHandlePointerDown($event)"
            (seatClick)="onSeatClick($event)"
            (seatToggle)="onSeatToggle($event)"
            (seatPaint)="onSeatPaint($event)"
            (rowClick)="onRowClick($event)"
            (rowDblClick)="onRowDblClick($event)"
            (colClick)="onColClick($event)"
            (colDblClick)="onColDblClick($event)"
          ></g>
        } @else {
          <!-- Layout Elements rendered via standalone OnPush LayoutElementNodeComponent -->
          <g
            app-layout-element-node
            [element]="$any(item.data)"
            [selected]="isElementSelected($any(item.data))"
            [editable]="editable()"
            [snapStep]="snapStep()"
            (elementClick)="onElementClick($event)"
            (elementPointerDown)="onElementPointerDown($event)"
            (handlePointerDown)="onElementHandlePointerDown($event)"
            (elementKeyDown)="onElementKeyDown($event)"
          ></g>
        }
      }
    </g>
  </svg>
</div>
