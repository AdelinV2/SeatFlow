<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading()"
  (click)="handleClick($event)"
  class="btn-spring relative inline-flex cursor-pointer select-none items-center justify-center overflow-hidden rounded-xl font-medium transition-all duration-150 ease-out active:scale-[0.97] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
  [class.w-full]="fullWidth()"
  [ngClass]="[
    variant() === 'primary'
      ? 'animate-sheen bg-indigo-600 text-white shadow-lg shadow-indigo-500/25 hover:bg-indigo-500'
      : '',
    variant() === 'secondary'
      ? 'border border-[var(--color-border)] bg-[var(--color-surface-elevated)] text-[var(--color-text-primary)] hover:bg-slate-700/10'
      : '',
    variant() === 'ghost' ? 'text-[var(--color-text-secondary)] hover:bg-slate-800/10' : '',
    variant() === 'danger'
      ? 'bg-rose-600 text-white shadow-lg shadow-rose-500/25 hover:bg-rose-500'
      : '',
    variant() === 'success'
      ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-500/25 hover:bg-emerald-500'
      : '',
    size() === 'sm' ? 'gap-1.5 px-3 py-1.5 text-xs' : '',
    size() === 'md' ? 'gap-2 px-4 py-2.5 text-sm' : '',
    size() === 'lg' ? 'gap-2.5 px-6 py-3.5 text-base' : '',
  ]"
>
  @if (loading()) {
    <svg class="size-4 animate-spin" aria-hidden="true" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v8H4z" />
    </svg>
    <span class="sr-only">Loading</span>
  } @else if (icon()) {
    <span class="text-base leading-none" aria-hidden="true">{{ icon() }}</span>
  }

  <span class="relative z-10 inline-flex items-center"><ng-content /></span>
</button>
