<div class="qr-dialog-shell rounded-3xl overflow-hidden bg-slate-900 border border-slate-700/60 text-white shadow-2xl" role="document">
  <header class="flex items-start justify-between gap-3 px-6 pt-5 pb-3 border-b border-slate-800">
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2 mb-1">
        <span class="inline-block size-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <p class="text-[10px] font-black uppercase tracking-widest text-indigo-400">
          SeatFlow Official Pass
        </p>
      </div>
      <h2 class="m-0 text-xl font-black text-white tracking-tight truncate drop-shadow-sm">
        {{ title() }}
      </h2>
    </div>

    <button
      type="button"
      class="size-8 inline-flex items-center justify-center rounded-full text-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer -mr-2 -mt-1"
      aria-label="Close ticket QR code"
      (click)="close()"
    >
      <span aria-hidden="true">&times;</span>
    </button>
  </header>

  <mat-dialog-content class="qr-dialog-content !p-6 !m-0 !overflow-x-hidden flex flex-col items-center">
    <div class="flex flex-col items-center w-full max-w-xs mx-auto space-y-4">
      <div
        class="qr-code-frame relative flex aspect-square w-56 sm:w-60 items-center justify-center rounded-2xl border-2 border-white/20 bg-white p-3.5 shadow-2xl ring-4 ring-indigo-500/20"
      >
        @if (qrImageUrl()) {
          <img
            class="block size-full [image-rendering:pixelated]"
            [src]="qrImageUrl()"
            [alt]="'QR code for ticket ' + ticketCode()"
            width="220"
            height="220"
          />
        } @else if (qrError()) {
          <p class="max-w-44 text-center text-xs font-semibold text-rose-600" role="alert">
            {{ qrError() }}
          </p>
        } @else {
          <div
            class="size-full animate-pulse rounded-xl bg-slate-100"
            aria-label="Generating QR code"
          ></div>
        }
      </div>

      <p class="text-center text-xs text-slate-400 font-medium leading-relaxed px-2">
        📱 Maximize screen brightness and present this pass at the gate scanner.
      </p>

      <div
        class="w-full rounded-2xl border border-slate-800 bg-slate-950/70 p-3 text-center shadow-inner"
      >
        <span
          class="block text-[9px] font-black uppercase tracking-widest text-slate-400"
        >
          Alphanumeric Ticket Code
        </span>
        <code
          class="mt-1 block font-mono text-sm sm:text-base font-black tracking-wider text-indigo-400 select-all"
        >
          {{ ticketCode() || 'Unavailable' }}
        </code>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="center" class="qr-dialog-actions !p-5 !m-0 border-t border-slate-800 bg-slate-950/40">
    <button
      type="button"
      class="btn-spring inline-flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] px-5 py-3 text-xs font-bold text-white shadow-lg shadow-indigo-600/30 transition-all cursor-pointer disabled:opacity-50"
      [disabled]="!ticketCode().trim()"
      (click)="copyTicketCode()"
    >
      <span aria-hidden="true">{{ copied() ? '✓' : '⧉' }}</span>
      <span>{{ copied() ? 'Copied to Clipboard' : 'Copy Ticket Code' }}</span>
    </button>
  </mat-dialog-actions>
</div>
