# SeatFlow frontend edge: Angular SPA + API/WebSocket reverse proxy
# Listens on an unprivileged internal port. TLS termination is owned by P10-008.
# Proxies /api/ to api-gateway:8080 and /ws/ with WebSocket upgrade.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (P10-008 may add HSTS when TLS is enabled)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.stripe.com https://r.stripe.com https://*.stripe.network wss: ws:; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'self';" always;

    # Do not expose nginx version
    server_tokens off;

    # The built-in combined format excludes Authorization headers.
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    # Correlation header handling: generate if missing, propagate to upstream
    # Note: nginx does not generate UUID natively; we propagate incoming and set a placeholder if absent.
    # The API Gateway / services generate/ensure correlation IDs.

    # Static assets with content hashing: long cache, immutable
    location ~* \.(?:js|css|woff|woff2|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
        access_log off;
    }

    # index.html must not be cached (SPA shell). Because this location defines
    # add_header directives, repeat the document security headers here: nginx
    # does not inherit server-level add_header values into such a location.
    location = /index.html {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.stripe.com https://r.stripe.com https://*.stripe.network wss: ws:; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'self';" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Runtime env.js (publishable key only, safe to expose but keep fresh)
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # API reverse proxy - same origin for frontend, avoids CORS in prod
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Propagate correlation headers if present
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header X-Request-Id $http_x_request_id;
        # Timeouts sensible for API
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        # Do not forward Authorization header in logs; nginx access log already excludes it via custom format
        proxy_set_header Authorization $http_authorization;
    }

    # WebSocket / STOMP endpoint (SockJS + STOMP via api-gateway)
    location /ws/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 5s;
        # Disable buffering for WS
        proxy_buffering off;
    }

    # Alternative WebSocket path without trailing slash (some clients use /ws)
    location = /ws {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA fallback - must be last. Repeat document security headers for the same
    # nginx add_header inheritance reason as /index.html above.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.stripe.com https://r.stripe.com https://*.stripe.network wss: ws:; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'self';" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Health endpoint for compose/docker
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
