# Production-only health windows for the single e2-highmem-2 VM.
# Cold simultaneous JVM startup is CPU-bound on 2 vCPU; these grace periods
# prevent Docker from reporting false failures while retaining normal probes
# after startup. Local Compose defaults remain intentionally faster.

services:
  kafka:
    healthcheck:
      timeout: 45s
      interval: 10s
      retries: 10
      start_period: 30s

  eureka-server:
    healthcheck:
      start_period: 480s

  api-gateway:
    healthcheck:
      start_period: 480s

  user-service:
    healthcheck:
      start_period: 480s

  seat-map-service:
    healthcheck:
      start_period: 480s

  event-service:
    healthcheck:
      start_period: 480s

  reservation-service:
    healthcheck:
      start_period: 480s

  payment-service:
    healthcheck:
      start_period: 480s

  ticket-service:
    healthcheck:
      start_period: 480s

  realtime-service:
    healthcheck:
      start_period: 480s

  notification-service:
    healthcheck:
      start_period: 480s
