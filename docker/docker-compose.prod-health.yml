# Production-only health and resource overrides for the single e2-highmem-2 VM.
# The production host has 2 vCPU / 16 GiB. Cold simultaneous JVM startup is
# CPU-bound and several services have also exceeded their original cgroup memory
# ceilings even while the host itself retained ample free RAM. Keep local Compose
# defaults intentionally smaller/faster; these values apply only to production.

services:
  kafka:
    healthcheck:
      # Avoid kafka-topics.sh here: that probe launches a JVM every interval and
      # materially worsens CPU starvation during a full production cold start.
      # A successful TCP connect proves the broker listener is accepting clients;
      # application clients retain their own Kafka retry/reconnect behavior.
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      timeout: 5s
      interval: 10s
      retries: 12
      start_period: 60s

  eureka-server:
    mem_limit: 512m
    environment:
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      start_period: 600s

  api-gateway:
    mem_limit: 768m
    environment:
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      start_period: 600s

  user-service:
    mem_limit: 768m
    environment:
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      start_period: 600s

  seat-map-service:
    mem_limit: 768m
    environment:
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      start_period: 600s

  event-service:
    mem_limit: 896m
    environment:
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      start_period: 600s

  reservation-service:
    mem_limit: 896m
    environment:
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      start_period: 600s

  payment-service:
    mem_limit: 768m
    environment:
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      start_period: 600s

  ticket-service:
    mem_limit: 768m
    environment:
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      start_period: 600s

  realtime-service:
    mem_limit: 768m
    environment:
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      start_period: 600s

  notification-service:
    mem_limit: 768m
    environment:
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      start_period: 600s

  tempo:
    # Tempo can temporarily spike during WAL replay and block compaction. The
    # production host retains ample memory headroom, so keep this override scoped
    # to production and allow enough cgroup memory to avoid OOM restart loops.
    mem_limit: 768m
