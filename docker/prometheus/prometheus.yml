global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'seatflow-eureka'
    metrics_path: '/actuator/prometheus'
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus-scrape-token
    static_configs:
      - targets: ['eureka-server:8761']

  - job_name: 'seatflow-gateway'
    metrics_path: '/actuator/prometheus'
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus-scrape-token
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'seatflow-services'
    metrics_path: '/actuator/prometheus'
    authorization:
      type: Bearer
      credentials_file: /run/secrets/prometheus-scrape-token
    static_configs:
      - targets:
          - 'user-service:8081'
          - 'seat-map-service:8082'
          - 'event-service:8083'
          - 'reservation-service:8084'
          - 'payment-service:8085'
          - 'ticket-service:8086'
          - 'realtime-service:8087'
          - 'notification-service:8088'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'seatflow_reservations_created_events_total'
        target_label: __name__
        replacement: 'seatflow_reservations_created_total'
        action: replace

  - job_name: 'seatflow-kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
