receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 150
    spike_limit_mib: 50
  batch:
    timeout: 1s
    send_batch_size: 512
  resourcedetection:
    detectors: [env, system]
    timeout: 5s
  attributes:
    actions:
      - key: deployment.environment
        action: upsert
        value: ${env:SEATFLOW_DEPLOYMENT_ENV:-docker}
      - key: service.version
        action: upsert
        value: ${env:SEATFLOW_VERSION:-dev}
      - key: service.instance.id
        action: upsert
        value: ${env:HOSTNAME:-unknown}

exporters:
  otlphttp/tempo:
    endpoint: ${env:TEMPO_OTLP_HTTP_ENDPOINT:-http://tempo:4318}
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 512
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, attributes, batch]
      exporters: [otlphttp/tempo, debug]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
