# Production override for single GCP Compute Engine VM (e2-highmem-2: 2 vCPU, 16 GiB)
# Apply with:
# docker compose -f docker/docker-compose.yml -f docker/docker-compose.services.yml -f docker/docker-compose.monitoring.yml -f docker/docker-compose.prod.yml config
#
# - Uses Artifact Registry immutable images via AR_BASE + SEATFLOW_IMAGE_TAG
# - SPRING_PROFILES_ACTIVE=prod + Docker DNS (postgres, kafka, redis, eureka-server)
# - Only Nginx edge is publicly exposed; all other ports are private (expose)
# - Persistent named volumes for PostgreSQL, Kafka, Prometheus, Grafana, Tempo, Loki
# - Conservative CPU/memory limits fitting 16 GiB with host headroom
# - Restart, log rotation, read-only where practical, no-new-privileges, health checks

services:
  postgres:
    ports: !reset []
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      # The init script consumes this to create the application role.
      DB_USERNAME: ${DB_USERNAME:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
    mem_limit: 768m
    cpus: 0.8
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # PostgreSQL requires writable data dir; not read_only

  redis:
    ports: !reset []
    expose:
      - "6379"
    command: ["redis-server", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD:?required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
    mem_limit: 256m
    cpus: 0.3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs:
      - /data:size=16m

  kafka:
    ports: !reset []
    expose:
      - "9092"
      - "9093"
    mem_limit: 768m
    cpus: 0.8
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  eureka-server:
    image: ${AR_BASE}/eureka-server:${SEATFLOW_IMAGE_TAG:?required}
    ports: !reset []
    expose:
      - "8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SEATFLOW_DEPLOYMENT_ENV: prod
      SEATFLOW_SERVICE_NAME: eureka-server
      SEATFLOW_VERSION: ${SEATFLOW_IMAGE_TAG}
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: eureka-server
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:-https://txyyirobwnomhxygbacq.supabase.co/auth/v1}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:-https://txyyirobwnomhxygbacq.supabase.co/auth/v1/.well-known/jwks.json}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.2}
      JAVA_TOOL_OPTIONS: "-javaagent:/opt/opentelemetry/opentelemetry-javaagent.jar -Xms128m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    mem_limit: 384m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

