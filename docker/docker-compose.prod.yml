      SEATFLOW_DEPLOYMENT_ENV: prod
      SEATFLOW_SERVICE_NAME: api-gateway
      SEATFLOW_VERSION: ${SEATFLOW_IMAGE_TAG}
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
