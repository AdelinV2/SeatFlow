      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api-gateway:
        condition: service_healthy

  otel-collector:
    image: ${AR_BASE}/otel-collector:${SEATFLOW_IMAGE_TAG:?required}
    ports: !reset []
    expose:
      - "4317"
      - "4318"
      - "13133"
      - "8888"
    mem_limit: 192m
    cpus: 0.3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    ports: !reset []
    expose:
      - "9090"
    mem_limit: 512m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-exporter:
    ports: !reset []
    expose:
      - "9308"
    mem_limit: 128m
    cpus: 0.2
    read_only: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    ports: !reset []
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    mem_limit: 256m
    cpus: 0.3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    image: ${AR_BASE}/tempo:${SEATFLOW_IMAGE_TAG:?required}
    ports: !reset []
    expose:
      - "3200"
      - "4317"
      - "4318"
    mem_limit: 256m
    cpus: 0.3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    ports: !reset []
    expose:
      - "3100"
    mem_limit: 256m
    cpus: 0.3
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    ports: !reset []
    mem_limit: 128m
    cpus: 0.2
    restart: unless-stopped
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pg_data:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  tempo_data:
    driver: local
  loki_data:
    driver: local
  promtail_data:
    driver: local

