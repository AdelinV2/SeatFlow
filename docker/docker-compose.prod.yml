      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES:-authenticated}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://seatflow.app}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.2}
      JAVA_TOOL_OPTIONS: "-javaagent:/opt/opentelemetry/opentelemetry-javaagent.jar -Xms256m -Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    mem_limit: 512m
    cpus: 0.6
    security_opt:
